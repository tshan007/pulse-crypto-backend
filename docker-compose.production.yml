# Production: points at real production Redis (.env.production); no bundled redis, same
# reasoning as docker-compose.uat.yml. For local smoke-testing the production image only
# — real deployment runs these images under your orchestrator (k8s, ECS, ...), not this.
# Run with:
#   docker compose -p pulsecrypto-production -f docker-compose.production.yml up --build
services:
  ingestion:
    build: .
    command: node packages/ingestion/dist/index.js
    env_file: .env.production

  broadcast:
    build: .
    command: node packages/broadcast/dist/index.js
    env_file: .env.production
    ports:
      - "8080:8080"
