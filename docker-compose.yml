# Default/local target: bundles redis, uses .env.development (matches the npm scripts'
# no-suffix-defaults-to-development convention — see loadEnv.ts). Other environments are
# self-contained files, not layered on this one — avoids Compose's environment-merge footguns.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ingestion:
    build: .
    command: node packages/ingestion/dist/index.js
    env_file: .env.development
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  broadcast:
    build: .
    command: node packages/broadcast/dist/index.js
    env_file: .env.development
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
