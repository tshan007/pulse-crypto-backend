# Development: a working local target, not a remote-infra placeholder (unlike
# docker-compose.uat.yml/docker-compose.production.yml, which point at real external
# hosts). Bundles its own `redis` — not exposed on the host, so it can't collide with
# docker-compose.yml's redis on 6379:6379 if both happen to run at once — and overrides
# REDIS_URL to reach it, the same way docker-compose.yml does for its own redis.
# Run with:
#   docker compose -p pulsecrypto-development -f docker-compose.development.yml up --build
services:
  redis:
    image: redis:7-alpine

  ingestion:
    build: .
    command: node packages/ingestion/dist/index.js
    env_file: .env.development
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  broadcast:
    build: .
    command: node packages/broadcast/dist/index.js
    env_file: .env.development
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
