# Debug overlay for docker-compose.development.yml — adds DEBUG=true on top via
# Compose's -f layering. Safe to layer here (unlike docker-compose.yml being overridden
# by the {uat,development,production} files — see their header comments) because this
# only adds one `environment:` key on top of the same base file; it never needs a
# different REDIS_URL/host to flow through untouched.
# Run with:
#   docker compose -p pulsecrypto-development -f docker-compose.development.yml -f docker-compose.development.debug.yml up --build
services:
  ingestion:
    environment:
      DEBUG: "true"

  broadcast:
    environment:
      DEBUG: "true"
